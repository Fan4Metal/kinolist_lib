[project]
name = "kinolist-lib"
version = "0.3.0"
description = "Списки фильмов в формате docx и теги mp4 на основе данных Кинопоиска"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "mutagen>=1.47.0",
    "parse-torrent-title>=2.8",
    "pillow>=12.0.0",
    "python-docx>=1.2.0",
    "pywin32>=311; sys_platform == 'win32'",
    "requests>=2.32.0",
    "requests-cache>=1.2.1",
    "tqdm>=4.67.1",
]

[project.scripts]
kl = "kinolist.cli:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.17.0",
    "pytest>=8.0",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kinolist"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
